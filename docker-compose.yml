services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - web

  # Old static site — kept running until Stage 5 cutover.
  # Uses pre-tagged image (resume:stable) so rebuilding the repo doesn't affect it.
  # To preserve it before first push: docker tag <old-image> resume:stable
  resume:
    image: resume:stable
    container_name: resume
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.resume.rule=PathPrefix(`/`)"
      - "traefik.http.routers.resume.entrypoints=web"
      - "traefik.http.services.resume.loadbalancer.server.port=80"
    networks:
      - web

  # New Next.js site — test on new.mkhalaweh.dev before cutover
  web:
    image: mkhalaweh-web:latest
    container_name: web
    restart: unless-stopped
    networks:
      - web
    volumes:
      - web_data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      DATA_DIR: "/app/data"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RESUME_EMAIL: "${RESUME_EMAIL:-}"
      RESUME_PHONE: "${RESUME_PHONE:-}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-new.rule=Host(`new.mkhalaweh.dev`)"
      - "traefik.http.routers.web-new.entrypoints=web"
      - "traefik.http.services.web-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.web-new.service=web-svc"

networks:
  web:
    external: false

volumes:
  web_data:
