services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - web

  web:
    image: mkhalaweh-web:latest
    container_name: web
    restart: unless-stopped
    networks:
      - web
    volumes:
      - web_data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/prod.db"
      DATA_DIR: "/app/data"
      JWT_SECRET: "${JWT_SECRET}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      RESUME_EMAIL: "${RESUME_EMAIL:-}"
      RESUME_PHONE: "${RESUME_PHONE:-}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`mkhalaweh.dev`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.services.web-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.web.service=web-svc"

networks:
  web:
    external: false

volumes:
  web_data:
